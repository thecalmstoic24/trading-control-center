name: Windows release validation
on:
  push:
    branches: [control-center-third-computer]
    paths: ['agent/**', 'coordinator/**', 'scripts/**', 'tests/**', '.github/workflows/validate.yml']
permissions:
  contents: read
jobs:
  agent:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Windows PowerShell 5.1 syntax and timing tests
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem agent,install -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens=$null; $errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if($errors){throw ($errors | Out-String)}
          }
          & ./tests/Test-Preview27.ps1
          & ./tests/Test-Preview28.ps1
          & ./tests/Test-Manual-Sync.ps1
      - name: Telemetry syntax and coordinator regressions
        shell: powershell
        run: |
          & ./tests/Test-Telemetry38.ps1
          python -m unittest discover -s tests -q
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: API-only updater regression
        shell: powershell
        run: ./tests/Test-API-Updater.ps1
      - name: Default account recovery guards
        shell: powershell
        run: ./tests/Test-DefaultAccount31.ps1
      - name: TLS timing, credentials and command transport
        shell: pwsh
        run: ./tests/Test-Gateway.ps1
      - name: Saved Edit fallback regression
        shell: powershell
        run: ./tests/Test-Edit-Location.ps1
      - name: Production HTTP asset regression
        shell: pwsh
        run: python -m unittest discover -s tests -p test_static_assets.py
      - name: Queue registration removal regression
        shell: pwsh
        run: python -m unittest discover -s tests -p test_preview36.py
      - name: Funded strategy eligibility and queue guards
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_funded*.py"
      - name: JavaScript regressions
        shell: pwsh
        run: |
          node tests/test_ratio.cjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node tests/test_vm_error.cjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node tests/test_queue_display.cjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node tests/test_trading_layout.cjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node tests/test_draft_payload.cjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node tests/test_vm_sync.cjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node tests/test_funded_suggestions.cjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node tests/test_suggestions.cjs
          exit $LASTEXITCODE

      - name: Browser layout and confirmation regression
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/tcc-browser" playwright@1.51.1 --ignore-scripts --no-audit --no-fund
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $env:NODE_PATH="$env:RUNNER_TEMP/tcc-browser/node_modules"
          $env:TEMP=$env:RUNNER_TEMP
          node "$env:NODE_PATH/playwright/cli.js" install chromium
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $browserFailed = 0
          foreach($test in @('test_preview38_browser.cjs','test_funded_browser.cjs','test_preview36_browser.cjs','test_preview28_browser.cjs','test_suggestions_browser.cjs','test_preview34_browser.cjs','test_preview35_browser.cjs')) {
            node "tests/$test"
            if($LASTEXITCODE -ne 0){$browserFailed = 1}
          }
          exit $browserFailed

      - name: Browser review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review
          path: ${{ runner.temp }}/preview*.png
          if-no-files-found: ignore
