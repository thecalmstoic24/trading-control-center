name: Windows release validation
on:
  push:
    branches: [control-center-third-computer]
    paths: ['agent/**', 'coordinator/**', 'scripts/**', 'tests/**', '.github/workflows/validate.yml']
permissions:
  contents: read
jobs:
  agent:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Windows PowerShell 5.1 syntax and timing tests
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem agent,install -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens=$null; $errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if($errors){throw ($errors | Out-String)}
          }
          & ./tests/Test-Preview27.ps1
          & ./tests/Test-Preview28.ps1
          & ./tests/Test-Manual-Sync.ps1
      - name: TLS timing, credentials and command transport
        shell: pwsh
        run: ./tests/Test-Gateway.ps1
      - name: Saved Edit fallback regression
        shell: powershell
        run: ./tests/Test-Edit-Location.ps1
      - name: JavaScript regressions
        shell: pwsh
        run: |
          node tests/test_ratio.cjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node tests/test_vm_error.cjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node tests/test_queue_display.cjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node tests/test_trading_layout.cjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node tests/test_draft_payload.cjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node tests/test_vm_sync.cjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node tests/test_suggestions.cjs
          exit $LASTEXITCODE

      - name: Browser layout and confirmation regression
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/tcc-browser" playwright@1.51.1 --ignore-scripts --no-audit --no-fund
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $env:NODE_PATH="$env:RUNNER_TEMP/tcc-browser/node_modules"
          node "$env:NODE_PATH/playwright/cli.js" install chromium
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node tests/test_preview28_browser.cjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          node tests/test_suggestions_browser.cjs
          exit $LASTEXITCODE
